<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loïck Rivemale — Portfolio 98</title>
<link rel="stylesheet" href="styles/win98.css" />
<link rel="stylesheet" href="styles/desktop.css" />
<link rel="stylesheet" href="styles/landing.css" />
<style>
  html, body { margin: 0; background: #0c0c0c; }
  * { box-sizing: border-box; }
  body { overflow-x: hidden; font-family: var(--w98-font); color: var(--w98-text); }
  /* the flow scrolls in normal document flow */
  .d98-root { position: relative; }

  /* draggable affordance */
  .w98-titlebar { cursor: move; }
  .w98-tb-btn { cursor: pointer; }

  /* ---------- cascading Start menu (site architecture) ---------- */
  .fsm .fsm-list { width: 196px; padding: 2px; position: relative; }
  .fsm-item-wrap { position: relative; }
  .fsm-item { display: flex; align-items: center; gap: 9px; padding: 6px 8px; font-size: 13px; cursor: default; }
  .fsm-item .ico { width: 24px; height: 24px; image-rendering: pixelated; flex: 0 0 auto; }
  .fsm-item .lbl { flex: 1 1 auto; }
  .fsm-item:hover, .fsm-item.is-open { background: #000080; color: #fff; }
  .fsm-item.has-sub::after { content: "\25B8"; margin-left: auto; font-size: 11px; }
  /* tiny engraved separator under each menu item — kept subtle (single soft line) */
  .fsm-list > .fsm-item-wrap:not(:last-child) { border-bottom: 1px solid #e2ded6; box-shadow: none; }
  .fsm-sub .fsm-subitem:not(:last-child) { border-bottom: 1px solid #e2ded6; box-shadow: none; }
  /* breathing room between the last desk item and the Shut Down button */
  .fsm .d98-sm-divider { margin: 10px 2px 4px; }

  /* welcome "scroll down" wordart — fades in once the melt animation begins */
  .wm-scrolldown { position: absolute; left: 0; right: 0; bottom: 50px; z-index: 6;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    pointer-events: none; animation: wmFadeIn .7s ease both; }
  @keyframes wmFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .wm-scrolltext { display: inline-block; transform-origin: center; animation: wmRock 2.6s ease-in-out infinite; }
  @keyframes wmRock { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .wm-chevron { color: #eafcff; font-size: 26px; line-height: 1; text-shadow: 0 2px 3px rgba(0,0,0,.55); }
  .fsm-sub {
    position: absolute; left: 100%; bottom: -3px; z-index: 1200;
    min-width: 208px; background: var(--w98-face);
    box-shadow: inset -1px -1px 0 #0a0a0a, inset 1px 1px 0 #fff, inset -2px -2px 0 #808080, inset 2px 2px 0 #dfdfdf, 2px 2px 8px rgba(0,0,0,.35);
    padding: 3px;
  }
  .fsm-subitem { display: flex; align-items: center; gap: 9px; padding: 5px 8px; font-size: 12.5px; cursor: default; white-space: nowrap; }
  .fsm-subitem .ico { width: 20px; height: 20px; image-rendering: pixelated; flex: 0 0 auto; }
  .fsm-subitem:hover { background: #000080; color: #fff; }

  /* ---------- welcome window (from the approved mock) ---------- */
  .lv2-welcome { width: 560px; max-width: calc(100vw - 32px); position: relative; }
  .lv2-hero { position: relative; padding: 18px 24px 22px; overflow: hidden; }
  .lv2-flag {
    position: absolute; top: 26px; right: -14px; width: 480px; height: 282px;
    background: url("uploads/flag-wave.png") center / contain no-repeat;
    opacity: .95; pointer-events: none;
  }
  .lv2-hero > *:not(.lv2-flag) { position: relative; z-index: 1; }
  .lv2-eyebrow {
    font-family: "Courier New", monospace; font-size: 13px; letter-spacing: 2px;
    color: #878787; margin-bottom: 10px; white-space: nowrap;
  }
  .lv2-name { margin: 0 0 16px; line-height: .98; font-family: Arial, "Helvetica Neue", sans-serif; }
  .lv2-name .first { display: block; font-size: 62px; font-weight: 900; letter-spacing: -1.5px; color: #0a0a0a; }
  .lv2-name .last  { display: block; font-size: 62px; font-weight: 900; letter-spacing: -1px; color: #0a0a0a; padding-right: 8px; }
  .lv2-name .role  { display: block; margin-top: 4px; font-size: 46px; font-weight: 900; font-style: normal; text-transform: uppercase; letter-spacing: -1px; color: #1717c4; }
  .lv2-tag { margin: 0 0 20px; font-size: 18px; line-height: 1.42; color: #1d1d1d; max-width: 470px; text-wrap: pretty; }
  .lv2-cta { display: flex; gap: 12px; align-items: stretch; }
  .lv2-cta .w98-btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; color: var(--w98-text); cursor: pointer; }
  .lv2-btn-main { padding: 9px 26px; font-size: 16px; font-weight: 700; }
  .lv2-btn-resume { padding: 9px 18px; font-size: 14px; }

  /* ---------- Tech Stack window (reused from Tech Stack.html) ---------- */
  .ts-win { width: min(1180px, 100%); height: min(944px, 100%); display: flex; flex-direction: column; padding: 3px; }
  .ts-body { flex: 1 1 auto; min-height: 0; margin: 0 1px; display: flex; background: #fff; overflow: hidden; }
  .ts-web { flex: 0 0 210px; min-width: 0; display: flex; flex-direction: column; overflow: hidden;
    background: #fff url("uploads/TechStackCloudBackground.png") top center / cover no-repeat; }
  .ts-sky { height: 96px; position: relative; overflow: hidden; background: transparent; }
  .ts-sky::before { content: none; }
  .ts-drive { position: absolute; top: 8px; left: 11px; z-index: 2; image-rendering: pixelated; filter: drop-shadow(1px 1px 0 rgba(0,0,0,.28)); }
  .ts-wordart { margin: -20px 0 0 13px; position: relative; z-index: 3;
    font-family: Tahoma, "Segoe UI", sans-serif; font-weight: 700; font-style: normal; font-size: 26px; line-height: .94; letter-spacing: 0;
    color: #0a0a0a; }
  .ts-rule { height: 2px; margin: 9px 13px 0; background: linear-gradient(90deg, #e23b2e 0%, #e23b2e 22%, #f3c521 28%, #f3c521 48%, #2faf4e 54%, #2faf4e 74%, #1c63d6 80%, rgba(28,99,214,0) 100%); }
  .ts-desc { padding: 11px 13px 6px; font-size: 11.5px; color: var(--w98-text); }
  .ts-desc-lede { font-size: 12px; line-height: 1.45; margin-bottom: 9px; }
  .ts-desc-meta { font-size: 11px; color: var(--w98-text-dim); line-height: 1.5; text-wrap: pretty; }
  .ts-desc-name { font-weight: 700; font-size: 14px; line-height: 1.15; margin-bottom: 3px; }
  .ts-desc-cat { font-size: 11px; color: var(--w98-text-dim); }
  .ts-desc-sub { margin-top: 7px; font-family: "Courier New", monospace; font-size: 10.5px; color: #303030; }
  .ts-desc-tier { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 11px; }
  .ts-desc-tier i { width: 9px; height: 9px; flex: 0 0 auto; }
  .ts-desc-tier.is-p i { background: var(--w98-navy); }
  .ts-desc-tier.is-p { color: var(--w98-navy); font-weight: 700; }
  .ts-desc-tier.is-f i { box-shadow: inset 0 0 0 1px #9a9a9a; }
  .ts-desc-tier.is-f { color: var(--w98-text-dim); }
  .ts-weblegend { margin-top: auto; padding: 9px 13px; display: flex; gap: 14px; font-size: 10px; color: var(--w98-text-dim); font-family: "Courier New", monospace; border-top: 1px solid #e6e6e6; }
  .ts-weblegend span { display: inline-flex; align-items: center; }
  .ts-weblegend i { width: 8px; height: 8px; margin-right: 5px; display: inline-block; }
  .ts-weblegend i.p { background: var(--w98-navy); }
  .ts-weblegend i.f { box-shadow: inset 0 0 0 1px #9a9a9a; }
  .ts-filewrap { flex: 1 1 auto; min-width: 0; display: flex; }
  .ts-files { flex: 1 1 auto; min-width: 0; background: #fff; overflow-y: auto; padding: 4px 8px 16px; }
  .ts-cat { margin-top: 13px; }
  .ts-cat:first-child { margin-top: 6px; }
  .ts-cat-head { display: flex; align-items: center; gap: 8px; padding: 0 5px 6px; }
  .ts-cat-head .t { font-size: 11px; font-weight: 700; color: #0c3590; white-space: nowrap; }
  .ts-cat-head .ln { flex: 1 1 auto; height: 0; border-top: 1px solid #cfcfcf; }
  .ts-cat-head .ct { font-family: "Courier New", monospace; font-size: 10px; color: var(--w98-text-dim); }
  .ts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 6px 4px; }
  .ts-item { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 3px 7px; cursor: pointer; text-align: center; user-select: none; }
  .ts-item .ic { image-rendering: pixelated; }
  .ts-item.is-working .ic { opacity: .62; }
  .ts-item .lbl { font-size: 12px; line-height: 1.15; padding: 1px 3px; max-width: 144px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ts-item:hover .lbl { text-decoration: underline; }
  .ts-item.is-sel .ic { filter: brightness(.55) saturate(1.3); }
  .ts-item.is-sel .lbl { background: var(--w98-hi); color: #fff; text-decoration: none; outline: 1px dotted #fff; outline-offset: -2px; }

  /* ---------- video player (My Videos) — reused from Videos.html ---------- */
  .vp-win { width: 940px; height: 680px; display: flex; flex-direction: column; padding: 3px; }
  .vp-body { flex: 1 1 auto; min-height: 0; display: flex; gap: 4px; margin: 0 1px 4px; }
  .vp-tree { width: 236px; flex: 0 0 auto; background: #fff; overflow-y: auto; padding: 5px 3px; font-size: 12px; }
  .vp-root { display: flex; align-items: center; gap: 6px; padding: 2px 5px; font-weight: 700; }
  .vp-node { display: flex; align-items: center; gap: 6px; padding: 2px 5px 2px 16px; cursor: pointer; white-space: nowrap; user-select: none; }
  .vp-node .lbl { font-weight: 700; }
  .vp-node .cnt { margin-left: auto; font-family: "Courier New", monospace; font-size: 10px; color: var(--w98-text-dim); }
  .vp-pm { width: 13px; height: 13px; flex: 0 0 auto; display: grid; place-items: center; background: #fff; border: 1px solid #808080; font-family: "Courier New", monospace; font-size: 11px; line-height: 1; color: #1d1d1d; }
  .vp-leaves { margin-left: 22px; border-left: 1px dotted #9a9a9a; padding-left: 4px; }
  .vp-leaf { display: flex; align-items: center; gap: 6px; padding: 2px 5px; cursor: pointer; white-space: nowrap; user-select: none; color: var(--w98-text); }
  .vp-leaf .lbl { overflow: hidden; text-overflow: ellipsis; }
  .vp-leaf .dur { margin-left: auto; font-family: "Courier New", monospace; font-size: 10px; color: var(--w98-text-dim); }
  .vp-leaf.is-sel { background: #000080; color: #fff; }
  .vp-leaf.is-sel .dur { color: #cfe8ff; }
  .vp-leaf:not(.is-sel):hover { background: #d6e4f5; }
  .vp-stagewrap { flex: 1 1 auto; min-width: 0; background: #000; display: grid; place-items: center; padding: 8px; position: relative; overflow: hidden; }
  .vp-frame { position: relative; height: 100%; aspect-ratio: 9 / 16; max-width: 100%; background: #000; overflow: hidden; outline: 1px solid #2c2c2c; }
  .vp-canvas { position: absolute; inset: 0; }
  .vp-cap-top { position: absolute; top: 8px; left: 8px; right: 8px; z-index: 3; font-family: "Courier New", monospace; font-size: 11px; letter-spacing: .5px; color: #e8f4ff; text-transform: uppercase; text-shadow: 0 1px 2px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vp-ep { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -60%); z-index: 2; font-family: "Arial Black", Impact, sans-serif; font-weight: 900; font-size: 44px; letter-spacing: 1px; text-shadow: 0 2px 0 rgba(0,0,0,.55); white-space: nowrap; }
  .vp-drop { position: absolute; left: 10px; right: 10px; bottom: 12px; z-index: 3; font-family: "Courier New", monospace; font-size: 10px; line-height: 1.5; color: #b9c6cc; text-align: center; letter-spacing: .4px; }
  .vp-paused { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; }
  .vp-paused > span { transform: scale(2.4); filter: drop-shadow(0 2px 4px rgba(0,0,0,.7)); opacity: .9; }
  .vp-scan { position: absolute; inset: 0; z-index: 5; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }

  /* ================= MOBILE / SMALL-TABLET LAYOUT ================= */
  .m98f { position: relative; width: 100%; }
  .m98-screen { position: relative; width: 100%; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
  .m98-inner { flex: 1 1 auto; display: flex; flex-direction: column; gap: 12px; padding: 12px 12px 46px; }
  .m98f .m98-screen:first-of-type .m98-inner { justify-content: center; }

  /* shortcut dock at the top of each desk */
  .m98-dock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 4px; padding: 4px 2px 2px; }
  .m98-dockbtn { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; -webkit-tap-highlight-color: transparent; }
  .m98-dockimg { position: relative; width: 46px; height: 46px; display: grid; place-items: center; }
  .m98-dockimg > img:not(.m98-dockarrow) { width: 42px; height: 42px; image-rendering: pixelated; filter: drop-shadow(1px 1px 0 rgba(0,0,0,.45)); }
  .m98-dockarrow { position: absolute; left: -1px; bottom: -1px; width: 14px; height: 14px; image-rendering: pixelated; }
  .m98-docklbl { font-size: 11px; color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,.7); line-height: 1.15; padding: 0 4px; max-width: 84px; }
  .m98-dockbtn.is-on .m98-docklbl { background: #000080; outline: 1px dotted #cdd8ff; outline-offset: -1px; }

  /* dither dissolve strip between desks */
  .m98-dither { display: block; width: 100%; height: 132px; image-rendering: pixelated; }

  /* window wrapper — neutralise fixed desktop widths/heights */
  .m98-winwrap { width: 100%; }
  .mscope .w98-window { width: 100% !important; max-width: 100% !important; height: auto !important; max-height: none !important; }
  .m98f .lv2-welcome { width: 100% !important; }
  .m98f .lv2-name .first, .m98f .lv2-name .last { font-size: clamp(38px, 13vw, 62px); }
  .m98f .lv2-name .role { font-size: clamp(24px, 8vw, 38px); }

  /* Tech Stack — stack web-view banner over the icon grid */
  .mscope .ts-body { flex-direction: column !important; }
  .mscope .ts-web { flex: 0 0 auto !important; border-right: none !important; border-bottom: 1px solid #b8b8b8; }
  .mscope .ts-files { max-height: 340px; }

  /* Videos — tree over the vertical stage */
  .mscope .vp-body { flex-direction: column !important; }
  .mscope .vp-tree { width: auto !important; max-height: 168px; }
  .mscope .vp-stagewrap { height: auto !important; padding: 8px; }
  .mscope .vp-frame { height: 56vh !important; width: auto !important; aspect-ratio: 9 / 16; max-width: 100%; }

  /* professional-experience detail: smaller modal over the darkened timeline */
  .m98-modal-backdrop { position: fixed; inset: 0; z-index: 9000; background: rgba(0,0,28,.55);
    display: flex; align-items: flex-start; justify-content: center; padding: 44px 14px 62px; overflow-y: auto; }
  .m98-modal { width: 100%; max-width: 520px; }

  /* taskbar: Start + four desks + clock, no window buttons */
  .m98-dock-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9500; }
  .m98-tasks { display: flex; gap: 3px; flex: 1 1 auto; min-width: 0; overflow: hidden; }
  .m98-taskbtn { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 5px; justify-content: center; }
  .m98-tasklbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
  @media (max-width: 420px) { .m98-tasklbl { display: none; } .m98-taskbtn { gap: 0; } }
</style>
</head>
