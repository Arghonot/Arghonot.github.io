<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DOOM melt × ordered dither dissolve</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: fixed; inset: 0; }

  #reveal { position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; display: block; }

  #demo-bg { position: absolute; inset: 0; display: none;
             background: conic-gradient(from 0deg at 50% 50%,
               #ff3d7f, #ffb000, #21d4fd, #b721ff, #ff3d7f);
             animation: spin 14s linear infinite; }
  #demo-bg::after {
    content: "▶  YOUR  SHOWREEL";
    position: absolute; inset: 0; display: grid; place-content: center;
    font: 700 clamp(22px, 6vw, 64px)/1 "Trebuchet MS", system-ui, sans-serif;
    letter-spacing: .15em; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35);
    mix-blend-mode: overlay;
  }
  @keyframes spin { to { transform: rotate(360deg) scale(1.6); } }

  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  @media (prefers-reduced-motion: reduce) { #demo-bg { animation: none; } }
</style>

<div id="stage">
  <video id="reveal" autoplay muted loop playsinline></video>
  <div id="demo-bg"></div>
  <canvas id="gl"></canvas>
</div>

<script>
// ─── Tweak everything here ──────────────────────────────────────────────────
const CONFIG = {
  videoSrc:    "https://loick.rivemale.space/videos/Landing.mp4",            // ← your showreel URL. Empty = animated stand-in.
  teal:        [0, 128, 128], // classic Win98 desktop teal (#008080)
  delay:       2.5,           // seconds solid teal before the melt starts
  duration:    3.5,           // seconds for teal → full showreel

  // — DOOM melt shape —
  columns:     180,           // number of melt strips (fewer = chunkier columns)
  variation:   0.85,          // horizontal lead/lag, 0 = flat top-down wipe
                              //   ~0.2 = classic ragged curtain · 0.5 = very uneven

  // — Ordered dither (the stipple texture of the dissolve) —
  cellSize:    3.0,           // device-px per dither cell — bigger = chunkier/retro
  bandWidth:   0.30,           // 0 = clean melt edge · 1 = heavy stipple
  edgeWidth:   0.08,          // glowing front thickness (in reveal units)

  glowColor:   [150, 255, 255],
  glow:        0.3,           // rim intensity, 0..1 (0 = off)

  replayOnClick: true,        // re-rolls a fresh melt each time, like DOOM
  maxDPR:      2.0,
};
// ────────────────────────────────────────────────────────────────────────────

const canvas = document.getElementById("gl");
const video  = document.getElementById("reveal");
const demoBg = document.getElementById("demo-bg");

if (CONFIG.videoSrc) {
  video.src = CONFIG.videoSrc; video.play().catch(() => {});
} else {
  video.style.display = "none"; demoBg.style.display = "block";
}

const gl = canvas.getContext("webgl", {
  alpha: true, premultipliedAlpha: false, antialias: false,
});

const VERT = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

const FRAG = `
  #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
  #else
    precision mediump float;
  #endif

  uniform vec2  uRes;
  uniform float uReveal;
  uniform vec3  uTeal;
  uniform vec3  uGlowCol;
  uniform float uGlow;
  uniform float uCell;
  uniform float uBand;
  uniform float uEdgeW;
  uniform float uVar;
  uniform sampler2D uCols;   // per-column melt delay (random walk), N×1

  // Compact recursive Bayer — no array indexing, safe on WebGL1 / mobile.
  float Bayer2(vec2 a){ a = floor(a); return fract(a.x * 0.5 + a.y * a.y * 0.75); }
  #define Bayer4(a) (Bayer2(0.5 * (a)) * 0.25 + Bayer2(a))
  #define Bayer8(a) (Bayer4(0.5 * (a)) * 0.25 + Bayer2(a))

  void main(){
    vec2 uv = gl_FragCoord.xy / uRes;

    // WHERE: top-to-bottom, offset per column by the DOOM random-walk delay.
    float colDelay = texture2D(uCols, vec2(uv.x, 0.5)).r;       // 0..1
    float order = ((1.0 - uv.y) + colDelay * uVar) / (1.0 + uVar);

    // TEXTURE: ordered dither rides on top → the stipple.
    float d = Bayer8(gl_FragCoord.xy / uCell);
    float threshold = order * (1.0 - uBand) + d * uBand;

    // WHEN: reveal sweeps the field over time.
    float alpha = 1.0 - step(threshold, uReveal);

    // Glowing rim on cells about to flip.
    float ahead = threshold - uReveal;
    float hot = (1.0 - smoothstep(0.0, uEdgeW, ahead)) * step(0.0, ahead) * alpha;
    vec3 col = mix(uTeal / 255.0, uGlowCol / 255.0, clamp(hot * uGlow, 0.0, 1.0));

    gl_FragColor = vec4(col, alpha);
  }
`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
gl.useProgram(prog);

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const ploc = gl.getAttribLocation(prog, "p");
gl.enableVertexAttribArray(ploc);
gl.vertexAttribPointer(ploc, 2, gl.FLOAT, false, 0, 0);

gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
gl.clearColor(0, 0, 0, 0);

// ── DOOM melt: bounded ±1 random walk across columns, normalized to 0..1 ──
const colsTex = gl.createTexture();
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D, colsTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

function rollMelt(){
  const n = Math.max(8, CONFIG.columns | 0);
  const raw = new Float32Array(n);
  raw[0] = 0;
  for (let i = 1; i < n; i++) raw[i] = raw[i - 1] + (Math.floor(Math.random() * 3) - 1); // -1,0,1
  let mn = Infinity, mx = -Infinity;
  for (const v of raw) { if (v < mn) mn = v; if (v > mx) mx = v; }
  const span = (mx - mn) || 1;
  const px = new Uint8Array(n * 4);
  for (let i = 0; i < n; i++) {
    const b = Math.round(((raw[i] - mn) / span) * 255);
    px[i*4] = b; px[i*4+1] = b; px[i*4+2] = b; px[i*4+3] = 255;
  }
  gl.bindTexture(gl.TEXTURE_2D, colsTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, n, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, px);
}
rollMelt();

const U = {};
["uRes","uReveal","uTeal","uGlowCol","uGlow","uCell","uBand","uEdgeW","uVar","uCols"]
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));
gl.uniform1i(U.uCols, 0);

let dpr = 1;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxDPR);
  const w = Math.floor(innerWidth * dpr), h = Math.floor(innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h);
  }
}
addEventListener("resize", resize);
resize();

const easeInOut = x => x * x * (3 - 2 * x);

let start = performance.now();
let running = true;

function frame(now){
  const t = (now - start) / 1000;
  let reveal = t < CONFIG.delay ? 0
             : easeInOut(Math.min((t - CONFIG.delay) / CONFIG.duration, 1));

  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uReveal, reveal);
  gl.uniform3f(U.uTeal, CONFIG.teal[0], CONFIG.teal[1], CONFIG.teal[2]);
  gl.uniform3f(U.uGlowCol, CONFIG.glowColor[0], CONFIG.glowColor[1], CONFIG.glowColor[2]);
  gl.uniform1f(U.uGlow, CONFIG.glow);
  gl.uniform1f(U.uCell, CONFIG.cellSize * dpr);
  gl.uniform1f(U.uBand, CONFIG.bandWidth);
  gl.uniform1f(U.uEdgeW, Math.max(CONFIG.edgeWidth, 0.001));
  gl.uniform1f(U.uVar, CONFIG.variation);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  if (reveal >= 1) { canvas.style.pointerEvents = "none"; running = false; return; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if (CONFIG.replayOnClick) {
  addEventListener("pointerdown", () => {
    rollMelt();                          // fresh melt each replay, like DOOM
    start = performance.now();
    canvas.style.pointerEvents = "auto";
    if (!running) { running = true; requestAnimationFrame(frame); }
    if (CONFIG.videoSrc) video.play().catch(() => {});
  });
}
</script>
