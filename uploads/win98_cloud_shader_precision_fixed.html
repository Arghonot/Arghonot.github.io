<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Fixed Windows 98 cloud shader with precision-safe hash, no square artifacts</h2>
<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 12px;">
  <canvas id="gl2" width="480" height="360" style="width: 100%; display: block; border-radius: var(--border-radius-md); aspect-ratio: 4/3;"></canvas>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 24px; margin-top: 1rem;">
  <div style="display: flex; align-items: center; gap: 12px;">
    <label style="font-size: 13px; color: var(--color-text-secondary); min-width: 78px;">Wind speed</label>
    <input type="range" id="spd2" min="0" max="2" step="0.05" value="0.35" style="flex:1;">
    <span id="spdo2" style="font-size: 13px; font-weight: 500; min-width: 34px; text-align: right;">0.35</span>
  </div>
  <div style="display: flex; align-items: center; gap: 12px;">
    <label style="font-size: 13px; color: var(--color-text-secondary); min-width: 78px;">Direction</label>
    <input type="range" id="dir2" min="0" max="360" step="1" value="200" style="flex:1;">
    <span id="diro2" style="font-size: 13px; font-weight: 500; min-width: 34px; text-align: right;">200°</span>
  </div>
  <div style="display: flex; align-items: center; gap: 12px;">
    <label style="font-size: 13px; color: var(--color-text-secondary); min-width: 78px;">Evolution</label>
    <input type="range" id="evo2" min="0" max="1" step="0.05" value="0.25" style="flex:1;">
    <span id="evoo2" style="font-size: 13px; font-weight: 500; min-width: 34px; text-align: right;">0.25</span>
  </div>
  <div style="display: flex; align-items: center; gap: 12px;">
    <label style="font-size: 13px; color: var(--color-text-secondary); min-width: 78px;">Coverage</label>
    <input type="range" id="cov2" min="0.30" max="0.60" step="0.01" value="0.44" style="flex:1;">
    <span id="covo2" style="font-size: 13px; font-weight: 500; min-width: 34px; text-align: right;">0.44</span>
  </div>
</div>
<script>
const cv2 = document.getElementById('gl2');
const g = cv2.getContext('webgl', { antialias: false, depth: false, stencil: false, alpha: false });
const VS2 = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS2 = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes;
uniform vec2 uWind;
uniform float uEvo;
uniform float uCov;
const float PERIOD = 64.0;

float hash(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float vnoise(vec2 p){
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  vec2 i0 = mod(i, PERIOD);
  vec2 i1 = mod(i + vec2(1.0, 0.0), PERIOD);
  vec2 i2 = mod(i + vec2(0.0, 1.0), PERIOD);
  vec2 i3 = mod(i + vec2(1.0, 1.0), PERIOD);
  float a = hash(i0);
  float b = hash(i1);
  float c = hash(i2);
  float d = hash(i3);
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float fbm(vec2 p){
  float v = 0.0;
  float amp = 0.55;
  vec2 shift = vec2(uEvo, -uEvo);
  for(int i = 0; i < 4; i++){
    v += amp * vnoise(p);
    p = p * 2.0 + shift;
    shift = shift * vec2(-2.0, 1.0);
    amp *= 0.5;
  }
  return v;
}
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = vec2(uv.x * uRes.x / uRes.y, uv.y) * 2.6 + uWind;
  float d = fbm(p);
  float edge = smoothstep(uCov, uCov + 0.30, d);
  float core = smoothstep(uCov + 0.18, uCov + 0.42, d);
  vec3 sky  = mix(vec3(0.42, 0.60, 0.83), vec3(0.55, 0.70, 0.88), uv.y * 0.5);
  vec3 col = mix(sky, vec3(0.80, 0.88, 0.96), edge);
  col = mix(col, vec3(0.99, 0.99, 1.0), core);
  gl_FragColor = vec4(col, 1.0);
}`;
function sh2(type, src){ const s = g.createShader(type); g.shaderSource(s, src); g.compileShader(s); return s; }
const pr = g.createProgram();
g.attachShader(pr, sh2(g.VERTEX_SHADER, VS2));
g.attachShader(pr, sh2(g.FRAGMENT_SHADER, FS2));
g.linkProgram(pr);
g.useProgram(pr);
const b2 = g.createBuffer();
g.bindBuffer(g.ARRAY_BUFFER, b2);
g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), g.STATIC_DRAW);
const l2 = g.getAttribLocation(pr, 'a');
g.enableVertexAttribArray(l2);
g.vertexAttribPointer(l2, 2, g.FLOAT, false, 0, 0);
const uR = g.getUniformLocation(pr, 'uRes');
const uW = g.getUniformLocation(pr, 'uWind');
const uE = g.getUniformLocation(pr, 'uEvo');
const uC = g.getUniformLocation(pr, 'uCov');
g.viewport(0, 0, 480, 360);
g.uniform2f(uR, 480, 360);

const q = id => document.getElementById(id);
let speed = 0.35, dirDeg = 200, evoSpeed = 0.25, cover = 0.44;
q('spd2').oninput = e => { speed = +e.target.value; q('spdo2').textContent = speed.toFixed(2); };
q('dir2').oninput = e => { dirDeg = +e.target.value; q('diro2').textContent = dirDeg + '\u00B0'; };
q('evo2').oninput = e => { evoSpeed = +e.target.value; q('evoo2').textContent = evoSpeed.toFixed(2); };
q('cov2').oninput = e => { cover = +e.target.value; q('covo2').textContent = cover.toFixed(2); };

const P = 64;
let wx = 0, wy = 0, ev = 0, last2 = performance.now();
function frame2(now){
  const dt = Math.min((now - last2) / 1000, 0.1);
  last2 = now;
  const r = dirDeg * Math.PI / 180;
  wx = (wx + Math.cos(r) * speed * dt * 0.25 + P) % P;
  wy = (wy + Math.sin(r) * speed * dt * 0.25 + P) % P;
  ev = (ev + evoSpeed * dt * 0.12) % P;
  g.uniform2f(uW, wx, wy);
  g.uniform1f(uE, ev);
  g.uniform1f(uC, cover);
  g.drawArrays(g.TRIANGLES, 0, 3);
  requestAnimationFrame(frame2);
}
requestAnimationFrame(frame2);
</script>
